
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Blog - BlogSpace</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">BlogSpace<span>.</span></a>

        <nav>
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="create-blog.html" class="nav-button">Create Blog</a>
        </nav>
    </header>

    <main class="auth-section">
        <div class="auth-card create-card">
            <p class="eyebrow">SHARE YOUR IDEAS</p>
            <h1>Create a New Blog</h1>
            <p class="auth-description">
                Write something meaningful and share it with the world.
            </p>

            <form id="blogForm">
                <label for="blogTitle">Blog Title</label>
                <input
                    type="text"
                    id="blogTitle"
                    placeholder="Enter your blog title"
                    required
                >

                <label for="blogCategory">Category</label>
                <select id="blogCategory" required>
                    <option value="">Select a category</option>
                    <option value="Technology">Technology</option>
                    <option value="Education">Education</option>
                    <option value="Lifestyle">Lifestyle</option>
                    <option value="Creativity">Creativity</option>
                </select>

                <label for="blogContent">Blog Content</label>
                <textarea
                    id="blogContent"
                    rows="7"
                    placeholder="Write your blog here..."
                    required
                ></textarea>

                <button type="submit" class="primary-button auth-button">
                    Publish Blog
                </button>
            </form>

            <p id="blogMessage" class="message"></p>
        </div>
    </main>

    <footer>
        <p>© 2026 BlogSpace. Made with care.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
